name: Publish web to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    # El primer push prepara Render; Pages espera las URL reales de sus servicios.
    if: ${{ vars.SOUNDFLOW_API_URLS != '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_API_URLS: ${{ vars.SOUNDFLOW_API_URLS }}
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate public API URLs
        run: |
          node --input-type=module -e '
            const urls = process.env.VITE_API_URLS.split(",").map(x => x.trim()).filter(Boolean);
            if (!urls.length) throw new Error("Configura SOUNDFLOW_API_URLS");
            for (const raw of urls) {
              const u = new URL(raw);
              if (u.protocol !== "https:" || u.username || u.password || u.search || u.hash || u.pathname !== "/") {
                throw new Error("Usa URL base HTTPS, sin rutas ni credenciales");
              }
            }
          '
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: frontend/dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
